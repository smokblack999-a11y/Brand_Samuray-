services:
  hub:
    build: ./hub
    restart: unless-stopped
    ports: ["8080:8080"]
    environment:
      X10_DB: /data/x10.db
      X10_ADMIN_TOKEN: ${X10_ADMIN_TOKEN:?set in .env}
      X10_ONLINE_WINDOW: 180
    volumes: [x10-data:/data]
  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?set in .env}
      X10_HUB: http://hub:8080
      X10_ADMIN_TOKEN: ${X10_ADMIN_TOKEN:?set in .env}
      X10_ALLOWED_CHAT_IDS: ${X10_ALLOWED_CHAT_IDS:-}
volumes:
  x10-data:
