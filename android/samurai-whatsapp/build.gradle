plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.samurai.whatsapp'
    compileSdk 35

    defaultConfig {
        applicationId 'com.samurai.whatsapp'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.1.1'
    }

    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
