services:
  core:
    build:
      context: ./core
    restart: unless-stopped
    env_file:
      - ./core/.env
    ports:
      - "8787:8787"
    volumes:
      - samurai-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8787/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  recovery-worker:
    build:
      context: ./core
    restart: unless-stopped
    env_file:
      - ./core/.env
    command: ["node", "recovery-worker.js"]
    volumes:
      - samurai-data:/app/data
      - ./:/workspace/repository
    environment:
      RECOVERY_REPO_DIR: /workspace/repository
      RECOVERY_POLL_MS: ${RECOVERY_POLL_MS:-5000}
      RECOVERY_AUTO_CREATE_PR: ${RECOVERY_AUTO_CREATE_PR:-false}
      RECOVERY_BASE_BRANCH: ${RECOVERY_BASE_BRANCH:-main}
      RECOVERY_TEST_COMMAND: ${RECOVERY_TEST_COMMAND:-["npm","test","--prefix","core"]}
    depends_on:
      core:
        condition: service_healthy

volumes:
  samurai-data:
