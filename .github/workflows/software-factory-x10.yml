name: SAMURAI Software Factory X10 CI

on:
  push:
    branches:
      - feat/software-factory-x10-v1
    paths:
      - "core/software_factory_x10/**"
      - ".github/workflows/software-factory-x10.yml"
  pull_request:
    branches:
      - feat/x10thinc-hamylion-v3
    paths:
      - "core/software_factory_x10/**"
      - ".github/workflows/software-factory-x10.yml"

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile package
        run: python -m compileall -q software_factory_x10
        working-directory: core
      - name: Run unit tests
        run: python -m unittest discover -s software_factory_x10 -p "test_*.py" -v
        working-directory: core
