name: X10THINC Recovery Ingress

on:
  workflow_run:
    workflows: ["SamuraiOS Core CI", "SamuraiOS Core X22 CI", "Build SamuraiOS APK", "X10THINC Kill Critic"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  enqueue-recovery:
    if: >-
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'timed_out' ||
      github.event.workflow_run.conclusion == 'cancelled' ||
      github.event.workflow_run.conclusion == 'startup_failure' ||
      github.event.workflow_run.conclusion == 'action_required'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require recovery endpoint configuration
        env:
          RECOVERY_URL: ${{ secrets.X10THINK_RECOVERY_URL }}
          RECOVERY_API_KEY: ${{ secrets.X10THINK_RECOVERY_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${RECOVERY_URL:-}" || { echo "X10THINK_RECOVERY_URL is not configured"; exit 1; }
          test -n "${RECOVERY_API_KEY:-}" || { echo "X10THINK_RECOVERY_API_KEY is not configured"; exit 1; }

      - name: Enqueue failed workflow run
        env:
          RECOVERY_URL: ${{ secrets.X10THINK_RECOVERY_URL }}
          RECOVERY_API_KEY: ${{ secrets.X10THINK_RECOVERY_API_KEY }}
          EVENT_JSON: ${{ toJson(github.event) }}
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/recovery-response.json -w '%{http_code}'             --connect-timeout 5 --max-time 30             -X POST "${RECOVERY_URL%/}/api/recovery/github"             -H "Content-Type: application/json"             -H "X-API-Key: ${RECOVERY_API_KEY}"             --data "${EVENT_JSON}")"
          cat /tmp/recovery-response.json
          test "$code" = "202" -o "$code" = "200"
