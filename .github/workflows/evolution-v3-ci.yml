name: EVOLUTION V3 isolated CI

on:
  push:
    branches:
      - feat/evolution-v3-integration-audit
    paths:
      - "core/evolution-v3/**"
      - "core/package.json"
      - "core/package-lock.json"
      - ".github/workflows/evolution-v3-ci.yml"
  pull_request:
    paths:
      - "core/evolution-v3/**"
      - "core/package.json"
      - "core/package-lock.json"
      - ".github/workflows/evolution-v3-ci.yml"

permissions:
  contents: read

jobs:
  evolution-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: core/package-lock.json
      - run: npm ci
      - name: Syntax checks
        run: |
          node --check evolution-v3/auth.js
          node --check evolution-v3/billing.js
          node --check evolution-v3/critic.js
          node --check evolution-v3/repair-agent.js
          node --check evolution-v3/safe-render.js
          node --check evolution-v3/seo.js
          node --check evolution-v3/index.js
      - name: Full Core and EVOLUTION V3 unit tests
        run: npm test
