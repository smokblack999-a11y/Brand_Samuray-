name: Prepare Stripe SDK lockfile (feature branch only)

on:
  push:
    branches:
      - feat/samurai-payments-provider-engine-v1
    paths:
      - .github/workflows/prepare-stripe-sdk.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/samurai-payments-provider-engine-v1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: core/package-lock.json
      - name: Install exact official Stripe SDK
        working-directory: core
        run: npm install --save-exact stripe@23.2.0
      - name: Run Core tests
        working-directory: core
        run: npm test
      - name: Commit package manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/package.json core/package-lock.json
          if git diff --cached --quiet; then
            echo "No manifest changes to commit."
            exit 0
          fi
          git commit -m "Add official Stripe Node SDK 23.2.0"
          git push origin HEAD:feat/samurai-payments-provider-engine-v1
