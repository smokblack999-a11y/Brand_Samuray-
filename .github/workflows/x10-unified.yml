name: SamuraiOS X10 Unified

on:
  push:
    paths:
      - "core/x10/**"
      - "core/server.js"
      - ".github/workflows/x10-unified.yml"
  pull_request:
    paths:
      - "core/x10/**"
      - "core/server.js"
      - ".github/workflows/x10-unified.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  x10:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: core/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: X10 syntax
        run: |
          node --check x10/fsm.js
          node --check x10/store.js
          node --check x10/policy.js
          node --check x10/kill-switch.js
          node --check x10/proof.js
          node --check x10/sandbox.js
          node --check x10/orchestrator.js
          node --check x10/index.js
      - name: X10 tests
        run: node --test x10/x10.test.js
