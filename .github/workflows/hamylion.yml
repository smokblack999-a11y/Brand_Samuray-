name: HAMYLION Core CI

on:
  push:
    paths:
      - "hamylion-core/**"
      - ".github/workflows/hamylion.yml"
  pull_request:
    paths:
      - "hamylion-core/**"
      - ".github/workflows/hamylion.yml"

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hamylion-core/backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r hamylion-core/backend/requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q hamylion-core/backend
      - name: Validate Docker Compose configuration
        working-directory: hamylion-core
        run: docker compose --env-file .env.example config --quiet

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build HAMYLION image
        uses: docker/build-push-action@v6
        with:
          context: ./hamylion-core/backend
          push: false
          tags: hamylion-core:ci
