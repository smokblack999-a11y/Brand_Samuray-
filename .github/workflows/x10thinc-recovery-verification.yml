name: X10THINC Recovery Verification

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, master]

permissions:
  contents: read
  checks: read

jobs:
  verify-recovery:
    if: startsWith(github.head_ref, 'recovery/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout recovery head
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: core/package-lock.json

      - name: Install dependencies
        working-directory: core
        run: npm ci

      - name: Secret scan
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE 'sk-(proj|svcacct)-[A-Za-z0-9_-]{20,}' -- ':!core/node_modules' ':!*.log'; then
            echo "Potential API key found"
            exit 1
          fi

      - name: Syntax gate
        working-directory: core
        run: |
          node --check recovery-store.js
          node --check recovery-router.js
          node --check recovery-worker.js
          node --check recovery-verification.js
          node --check interop/patch-candidate.js
          node --check interop/patch-proposal.js
          node --check x10thinc/recovery-state.js
          node --check x10thinc/runtime-guard.js
          node --check recovery-audit.js
          node --check x10thinc/kill-critic.js

      - name: Core tests
        working-directory: core
        run: npm test

      - name: Recovery invariants
        working-directory: core
        run: node --test test/recovery-state.test.js

      - name: Recovery proof metadata
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GITHUB_SHA}"
          test -n "${GITHUB_RUN_ID}"
          echo "verificationRunId=${GITHUB_RUN_ID}"
          echo "headSha=${GITHUB_SHA}"

      - name: Submit verified recovery proof
        if: success()
        env:
          RECOVERY_URL: ${{ secrets.X10THINK_RECOVERY_URL }}
          RECOVERY_API_KEY: ${{ secrets.X10THINK_RECOVERY_API_KEY }}
          JOB_ID: ${{ github.head_ref }}
          VERIFICATION_RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          job_id="${JOB_ID#recovery/}"
          test -n "${RECOVERY_URL:-}"
          test -n "${RECOVERY_API_KEY:-}"
          payload="$(python - <<'PY'
          import json, os
          print(json.dumps({
            "proof": {
              "jobId": os.environ["JOB_ID"].replace("recovery/","",1),
              "verificationRunId": int(os.environ["VERIFICATION_RUN_ID"]),
              "headSha": os.environ["HEAD_SHA"],
              "patchApplied": True,
              "sandboxPassed": True,
              "testsPassed": True,
              "ciPassed": True,
              "invariantsPassed": True,
              "evidenceComplete": True,
              "autonomousMerge": False
            }
          }))
          PY
          )"
          code="$(curl -sS -o /tmp/recovery-verify.json -w '%{http_code}'             --connect-timeout 5 --max-time 30             -X POST "${RECOVERY_URL%/}/api/recovery/jobs/${job_id}/verify"             -H "Content-Type: application/json"             -H "X-API-Key: ${RECOVERY_API_KEY}"             --data "${payload}")"
          cat /tmp/recovery-verify.json
          test "$code" = "200"
