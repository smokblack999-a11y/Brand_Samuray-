name: License Migration Lockfile Refresh

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "core/package.json"
      - "core/telegram.js"
      - "core/telegram-login.js"
      - "core/test/teleproto-migration.test.js"
      - "core/scripts/audit-licenses.js"
      - ".github/workflows/license-migration-lock.yml"

permissions:
  contents: write

jobs:
  refresh-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: core
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate lockfile from npm registry metadata
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install exact locked dependency tree
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit declared dependency licenses
        run: npm run license:audit

      - name: Run Core tests
        run: npm test

      - name: Commit generated lockfile to this feature branch only
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile is already current"
            exit 0
          fi
          git commit -m "chore(core): regenerate lockfile for teleproto"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
