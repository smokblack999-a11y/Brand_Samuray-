name: SAMURAI Software Factory HTTP Integration CI

on:
  push:
    branches:
      - feat/software-factory-http-api-v1
    paths:
      - "core/**"
      - ".github/workflows/software-factory-http.yml"
  pull_request:
    branches:
      - feat/software-factory-x10-v1
    paths:
      - "core/**"
      - ".github/workflows/software-factory-http.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  factory-http-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: core
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: core/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Core dependencies
        run: npm ci
      - name: Verify Docker and preload immutable sandbox image
        run: |
          docker info
          docker pull python:3.12-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b
      - name: Syntax and Python compile checks
        run: |
          node --check server.js
          node --check software-factory-http.js
          python -m compileall -q software_factory_x10
      - name: Run full Core Node test suite
        run: npm test
      - name: Run Factory Python and worker protocol tests
        run: python -m unittest discover -s software_factory_x10 -p "test_*.py" -v
