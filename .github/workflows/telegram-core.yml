name: Telegram Core

on:
  push:
    branches:
      - telegram-core-foundation
    paths:
      - "telegram-core/**"
      - ".github/workflows/telegram-core.yml"
  pull_request:
    paths:
      - "telegram-core/**"
      - ".github/workflows/telegram-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    name: Kotlin contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telegram-core
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run tests
        run: gradle test --no-daemon
