name: NEXUS Recovery Router

on:
  workflow_run:
    workflows:
      - "SamuraiOS Core CI"
      - "SamuraiOS Core X22 CI"
      - "Build SamuraiOS APK"
      - "X20 Verified Recovery Tests"
      - "X20 E2E Failure Probe"
    types: [completed]

permissions:
  contents: read

jobs:
  route:
    if: >-
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'timed_out' ||
      github.event.workflow_run.conclusion == 'startup_failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Route failed workflow to SamuraiOS X10
        env:
          RECOVERY_URL: ${{ secrets.X10THINK_RECOVERY_URL }}
          RECOVERY_API_KEY: ${{ secrets.X10THINK_RECOVERY_API_KEY }}
          PAYLOAD: ${{ toJSON(github.event) }}
        run: |
          set -euo pipefail
          test -n "${RECOVERY_URL:-}" || { echo "X10THINK_RECOVERY_URL is not configured"; exit 1; }
          test -n "${RECOVERY_API_KEY:-}" || { echo "X10THINK_RECOVERY_API_KEY is not configured"; exit 1; }

          endpoint="${RECOVERY_URL}/api/x10/github/workflow_run"

          code="$(curl -sS -o /tmp/x10.json -w '%{http_code}'             --connect-timeout 5 --max-time 20             -X POST "${endpoint}"             -H "Content-Type: application/json"             -H "X-API-Key: ${RECOVERY_API_KEY}"             --data "${PAYLOAD}")"

          cat /tmp/x10.json
          test "${code}" -ge 200 -a "${code}" -lt 300
