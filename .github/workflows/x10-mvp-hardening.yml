name: X10 MVP Hardening

on:
  push:
    branches:
      - x10-mvp-hardening
  pull_request:
    paths:
      - "x10/**"
      - "sandbox/**"
      - ".github/workflows/x10-mvp-hardening.yml"

permissions:
  contents: read

jobs:
  x10-policy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: x10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install X10 dependencies
        run: pip install -r requirements.txt
      - name: Compile control-plane Python
        run: python -m compileall -q .
      - name: Run policy tests
        run: python -m unittest -v

  sandbox-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sandbox image
        run: docker build -t samuraios-x10-sandbox:ci sandbox
      - name: Compile sandbox service
        run: docker run --rm samuraios-x10-sandbox:ci python -m py_compile /app/main.py
