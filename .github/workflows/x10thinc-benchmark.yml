name: X10THINC Benchmark
on:
  pull_request:
    paths:
      - "core/**"
      - "benchmarks/**"
      - "evaluation/**"
      - ".github/workflows/x10thinc-benchmark.yml"
  push:
    branches: ["main", "x10thinc/**"]
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax gate
        run: |
          node --check core/x10thinc-solver.js
          node --check core/kill-critic.js
          node --check core/x10thinc-diff-critic.js
          node --check core/x10think-recovery.js
      - name: Unit gates
        run: |
          node --test core/test/x10thinc-diff-critic.test.js
          node --test core/test/x10thinc-solver.test.js
      - name: Deterministic benchmark
        run: node evaluation/run-benchmark.js
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: x10thinc-benchmark-report
          path: evaluation/benchmark-report.json
          if-no-files-found: error
