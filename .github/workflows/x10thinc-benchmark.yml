name: X10THINC Benchmark
on:
  pull_request:
    paths:
      - "core/**"
      - "benchmarks/**"
      - "evaluation/**"
      - ".github/workflows/x10thinc-benchmark.yml"
  push:
    branches: ["main", "x10thinc/**"]
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check core/x10thinc-solver.js
      - run: node --check core/kill-critic.js
      - run: node --check core/x10thinc-diff-critic.js
