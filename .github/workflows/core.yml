name: SamuraiOS Core CI

# CI verification refresh: run full core gate on x26-revenue-allocator.
on:
  push:
    branches: [ "main", "master", "x26-revenue-allocator" ]
    paths:
      - 'core/**'
      - 'docker-compose.yml'
      - '.github/workflows/core.yml'
  pull_request:
    paths:
      - 'core/**'
      - 'docker-compose.yml'
      - '.github/workflows/core.yml'
  workflow_dispatch:

concurrency:
  group: samurai-core-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: samurai
          POSTGRES_PASSWORD: samurai_ci
          POSTGRES_DB: samurai_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U samurai -d samurai_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: core
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: core/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Secret pattern scan
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE 'sk-(proj|svcacct)-[A-Za-z0-9_-]{20,}' -- ':!core/node_modules' ':!*.log'; then
            echo "Potential OpenAI API key found in tracked files"
            exit 1
          fi
          echo "Secret scan: PASS"
      - name: Syntax check
        run: |
          node --check server.js
          node --check rate-limit.js
          node --check openai.js
          node --check business-bot.js
          node --check store.js
          node --check lead-engine.js
          node --check scripts/set-webhook.js
          node --check scripts/verify-config.js
          node --check dual-ai/providers.js
          node --check dual-ai/prompts.js
          node --check dual-ai/critic.js
          node --check dual-ai/store.js
          node --check dual-ai/engine.js
          node --check revenue-engine.js
          node --check revenue-ledger.js
          node --check revenue-black-box.js
          node --check revenue-control-plane.js
          node --check cost-model.js
          node --check revenue-postgres.js
          node --check probability-calibrator.js
          node --check x27-outcome-engine.js
          node --check x27-attribution-engine.js
          node --check x27-runtime.js
          node --check x28-revenue-rca.js
          node --check revenue-genome.js
          node --check budget-governor.js
          node --check experiment-engine.js
          node --check autonomous-revenue-loop.js
          node --check x33-economic-consistency.js
          node --check x33-service.js
          node --check autonomous-revenue-orchestrator.js
          node --check revenue-rollout-policy.js
          node --check x33-economic-consistency.test.js
          node --check x33-adversarial.test.js
          node --check x42-veto-audit.js
          node --check x42-veto-audit.test.js
      - name: X39-X44 deterministic risk-control tests
        working-directory: core
        run: go test -race ./...
      - name: Unit tests
        run: npm test
      - name: Install X33 PostgreSQL test driver
        run: npm install --no-save --package-lock=false pg@8.23.1
      - name: X33 PostgreSQL adversarial tests
        env:
          DATABASE_URL: postgresql://samurai:samurai_ci@localhost:5432/samurai_ci
        run: node --test x33-adversarial.test.js
      - name: X42 PostgreSQL veto audit tests
        env:
          DATABASE_URL: postgresql://samurai:samurai_ci@localhost:5432/samurai_ci
        run: node --test x42-veto-audit.test.js

  openai-smoke:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify secret exists without printing it
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${OPENAI_API_KEY:-}" || { echo "OPENAI_API_KEY is missing from GitHub Secrets"; exit 1; }
          echo "OPENAI_API_KEY is configured"
      - name: OpenAI authentication smoke test
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/openai.json -w '%{http_code}' --connect-timeout 5 --max-time 20 \
            -H "Authorization: Bearer ${OPENAI_API_KEY}" \
            https://api.openai.com/v1/models)"
          if [ "$code" != "200" ]; then
            echo "OpenAI smoke test failed (HTTP ${code})"
            rm -f /tmp/openai.json
            exit 1
          fi
          rm -f /tmp/openai.json
          echo "OpenAI authentication: PASS"

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Core image
        uses: docker/build-push-action@v6
        with:
          context: ./core
          push: false
          tags: samuraios-core:ci
