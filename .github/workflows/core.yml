name: SamuraiOS Core CI

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'core/**'
      - 'docker-compose.yml'
      - '.github/workflows/core.yml'
  pull_request:
    paths:
      - 'core/**'
      - 'docker-compose.yml'
      - '.github/workflows/core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: core
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: core/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Secret pattern scan
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE 'sk-(proj|svcacct)-[A-Za-z0-9_-]{20,}' -- ':!core/node_modules' ':!*.log'; then
            echo "Potential OpenAI API key found in tracked files"
            exit 1
          fi
          echo "Secret scan: PASS"

      - name: Syntax check
        run: |
          node --check server.js
          node --check rate-limit.js
          node --check openai.js
          node --check business-bot.js
          node --check store.js
          node --check lead-engine.js
          node --check scripts/set-webhook.js
          node --check scripts/verify-config.js

      - name: Unit tests
        run: npm test

  openai-smoke:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify secret exists without printing it
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${OPENAI_API_KEY:-}" || { echo "OPENAI_API_KEY is missing from GitHub Secrets"; exit 1; }
          echo "OPENAI_API_KEY is configured"

      - name: OpenAI authentication smoke test
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/openai.json -w '%{http_code}' --connect-timeout 5 --max-time 20 \
            -H "Authorization: Bearer ${OPENAI_API_KEY}" \
            https://api.openai.com/v1/models)"
          if [ "$code" != "200" ]; then
            echo "OpenAI smoke test failed (HTTP ${code})"
            rm -f /tmp/openai.json
            exit 1
          fi
          rm -f /tmp/openai.json
          echo "OpenAI authentication: PASS"

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Core image
        uses: docker/build-push-action@v6
        with:
          context: ./core
          push: false
          tags: samuraios-core:ci
