name: SamuraiOS Core CI

on:
  push:
    paths:
      - 'core/**'
      - 'docker-compose.yml'
      - '.github/workflows/core.yml'
  pull_request:
    paths:
      - 'core/**'
      - 'docker-compose.yml'
      - '.github/workflows/core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: core/package-lock.json
      - run: npm ci
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./core
          push: false
          tags: samuraios-core:ci
