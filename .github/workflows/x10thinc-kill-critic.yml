name: X10THINC Kill Critic

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  kill-critic:
    name: Deterministic proof gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run complete core test suite
        working-directory: core
        run: npm test
      - name: Assert Kill Critic modules exist
        working-directory: core
        run: |
          test -f x10thinc/kill-critic.js
          test -f x10thinc/real-life-gates.js
