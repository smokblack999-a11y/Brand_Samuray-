name: VDI Backend CI
on:
  push:
    branches: [main, "feat/vdi-rtsp-yolo-ocr-backend"]
    paths:
      - "services/vdi-backend/**"
      - ".github/workflows/vdi-backend.yml"
  pull_request:
    paths:
      - "services/vdi-backend/**"
      - ".github/workflows/vdi-backend.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/vdi-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/vdi-backend/requirements.txt
      - run: pip install fastapi==0.115.12 uvicorn==0.34.0 pydantic==2.10.6 python-dotenv==1.0.1 pytest==8.3.4 httpx==0.28.1
      - run: bash -n bootstrap.sh
      - run: PYTHONPATH=. pytest -q
