name: X10THINK Real Sandbox E2E

on:
  workflow_dispatch:
  push:
    paths:
      - "sandbox/**"
      - "core/agent-control.js"
      - "core/agent-sandbox-client.js"
      - "core/agent-evidence.js"
      - "core/agent-intent.js"
      - "core/e2e-fixture.js"
      - "core/agent-control.test.js"
      - "core/github-webhook.test.js"
      - ".github/workflows/x10think-sandbox-e2e.yml"
  pull_request:

permissions:
  contents: read

jobs:
  sandbox-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install real sandbox runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bubblewrap python3 python3-pip
          python3 -m pip install --user --break-system-packages fastapi==0.116.1 uvicorn==0.35.0
          bwrap --version

      - name: Start sandbox
        env:
          SANDBOX_WORKSPACE_ROOT: /tmp/x10-workspaces
          SANDBOX_TIMEOUT_SECONDS: 120
        run: |
          set -euo pipefail
          mkdir -p /tmp/x10-workspaces/workspace
          python3 sandbox/main.py > /tmp/x10-sandbox.log 2>&1 &
          echo $! > /tmp/x10-sandbox.pid
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8891/health && exit 0
            sleep 1
          done
          cat /tmp/x10-sandbox.log
          exit 1

      - name: Prepare baseline workspace and prove baseline failure
        env:
          WORKSPACE: /tmp/x10-workspaces/workspace
        run: |
          set -euo pipefail
          git clone . "$WORKSPACE"
          cd "$WORKSPACE"
          git checkout --detach "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if node -e 'if (require("./core/e2e-fixture") !== 2) process.exit(1)'; then
            echo "Baseline unexpectedly passed"
            exit 1
          fi
          node -e 'if (require("./core/e2e-fixture") !== 1) process.exit(1)'

      - name: Run Agent Control against the real sandbox
        env:
          X10THINK_SANDBOX_URL: http://127.0.0.1:8891
          WORKSPACE: /tmp/x10-workspaces/workspace
        run: |
          set -euo pipefail
          node <<'NODE'
          (async () => {
          const assert = require("node:assert/strict");
          const control = require("./core/agent-control");
          const sandbox = require("./core/agent-sandbox-client");

          const workflow = {
            workflow_run: {
              id: 910000001,
              name: "X10THINK Real Sandbox E2E",
              event: "workflow_dispatch",
              conclusion: "failure",
              head_sha: process.env.GITHUB_SHA,
              head_branch: "e2e",
              repository: { full_name: "smokblack999-a11y/Brand_Samuray-" }
            }
          };

          const ingested = control.ingestWorkflowRun(workflow, "e2e-sandbox-delivery");
          assert.equal(ingested.duplicate, false);
          const job = ingested.job;

          const patch = [
            "diff --git a/core/e2e-fixture.js b/core/e2e-fixture.js",
            "--- a/core/e2e-fixture.js",
            "+++ b/core/e2e-fixture.js",
            "@@ -1,3 +1,3 @@",
            ' "use strict";',
            "",
            "-module.exports = 1;",
            "+module.exports = 2;",
          ].join("\n") + "\n";

          const result = await control.reproduceRepair(job, {
            intent: "repair test failure",
            changedFiles: ["core/e2e-fixture.js"],
            diff: patch,
            workspacePath: process.env.WORKSPACE,
            testCommand: "node -e 'if (require(\"./core/e2e-fixture\") !== 2) process.exit(1)'"
          }, sandbox);

          console.log("SANDBOX_RESULT", JSON.stringify(result, null, 2));
  assert.equal(result.state, "REPAIR_ELIGIBLE");
          assert.equal(result.diagnosis.reproduction, true);
          assert.equal(result.diagnosis.causality, true);
          assert.equal(result.execution.autonomousWrite, false);
          assert.equal(result.execution.autonomousMerge, false);
          assert.equal(result.evidenceChain.headHash.length, 64);
          assert.equal(result.diagnosis.reproductionEvidence.candidate.passed, true);
          assert.equal(result.diagnosis.reproductionEvidence.candidate.networkAccess, false);
          console.log(JSON.stringify({
            ok: true,
            state: result.state,
            causality: result.diagnosis.causality,
            evidenceHeadHash: result.evidenceChain.headHash,
            patchSha256: result.diagnosis.reproductionEvidence.candidate.patchSha256
          }, null, 2));
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Stop sandbox
        if: always()
        run: |
          if test -f /tmp/x10-sandbox.pid; then kill "$(cat /tmp/x10-sandbox.pid)" || true; fi
          cat /tmp/x10-sandbox.log || true
