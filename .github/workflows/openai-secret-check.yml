name: OpenAI Secret Check

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify-openai-secret:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify secret is configured
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_API_KEY is missing from GitHub Secrets"
            exit 1
          fi
          echo "OPENAI_API_KEY is configured"

      - name: Validate OpenAI authentication without exposing the key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          http_code="$(curl -sS -o /tmp/openai-response.json -w '%{http_code}' \
            -H "Authorization: Bearer ${OPENAI_API_KEY}" \
            https://api.openai.com/v1/models)"

          if [ "$http_code" != "200" ]; then
            echo "OpenAI authentication failed (HTTP ${http_code})"
            exit 1
          fi

          echo "OpenAI authentication: PASS"
          rm -f /tmp/openai-response.json
