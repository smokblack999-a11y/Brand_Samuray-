name: X10THINK Recovery Enqueue
on:
  workflow_run:
    workflows: ["SamuraiOS Core CI", "SamuraiOS Core X22 CI", "X20 Verified Recovery Tests"]
    types: [completed]
permissions:
  contents: read
jobs:
  route:
    if: github.event.workflow_run.conclusion != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate configuration
        env:
          RECOVERY_URL: ${{ secrets.X10THINK_RECOVERY_URL }}
          RECOVERY_API_KEY: ${{ secrets.X10THINK_RECOVERY_API_KEY }}
          GITHUB_WEBHOOK_SECRET: ${{ secrets.GITHUB_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          test -n "${RECOVERY_URL:-}"
          test -n "${RECOVERY_API_KEY:-}"
          test -n "${GITHUB_WEBHOOK_SECRET:-}"
      - name: Route signed workflow event
        env:
          RECOVERY_URL: ${{ secrets.X10THINK_RECOVERY_URL }}
          RECOVERY_API_KEY: ${{ secrets.X10THINK_RECOVERY_API_KEY }}
          GITHUB_WEBHOOK_SECRET: ${{ secrets.GITHUB_WEBHOOK_SECRET }}
          PAYLOAD: ${{ toJSON(github.event) }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          endpoint="${RECOVERY_URL}/api/recovery/github/webhook"
          if [[ "${HEAD_BRANCH}" == x10think/recovery-* ]]; then endpoint="${RECOVERY_URL}/api/recovery/ci"; fi
          signature="sha256=$(printf '%s' "${PAYLOAD}" | openssl dgst -sha256 -hmac "${GITHUB_WEBHOOK_SECRET}" -hex | sed 's/^.* //')"
          code="$(curl -sS -o /tmp/recovery.json -w '%{http_code}' --connect-timeout 5 --max-time 20 -X POST "${endpoint}" -H "Content-Type: application/json" -H "X-GitHub-Event: workflow_run" -H "X-Hub-Signature-256: ${signature}" -H "X-API-Key: ${RECOVERY_API_KEY}" --data "${PAYLOAD}")"
          cat /tmp/recovery.json
          test "${code}" -ge 200 -a "${code}" -lt 300
