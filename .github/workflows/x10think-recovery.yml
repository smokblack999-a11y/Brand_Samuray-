name: X10THINK Recovery Enqueue

on:
  workflow_run:
    workflows: ["SamuraiOS Core CI", "SamuraiOS Core X22 CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  route:
    if: >-
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'timed_out' ||
      github.event.workflow_run.conclusion == 'cancelled' ||
      github.event.workflow_run.conclusion == 'startup_failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate recovery endpoint configuration
        env:
          RECOVERY_URL: ${{ secrets.X10THINK_RECOVERY_URL }}
          RECOVERY_API_KEY: ${{ secrets.X10THINK_RECOVERY_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${RECOVERY_URL:-}" || { echo "X10THINK_RECOVERY_URL is not configured"; exit 1; }
          test -n "${RECOVERY_API_KEY:-}" || { echo "X10THINK_RECOVERY_API_KEY is not configured"; exit 1; }

      - name: Route workflow result
        env:
          RECOVERY_URL: ${{ secrets.X10THINK_RECOVERY_URL }}
          RECOVERY_API_KEY: ${{ secrets.X10THINK_RECOVERY_API_KEY }}
          PAYLOAD: ${{ toJSON(github.event) }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          endpoint="${RECOVERY_URL}/api/recovery/github"
          if [[ "${HEAD_BRANCH}" == x10think/recovery-* ]]; then
            endpoint="${RECOVERY_URL}/api/recovery/ci"
          fi
          code="$(curl -sS -o /tmp/recovery.json -w '%{http_code}' \
            --connect-timeout 5 --max-time 20 \
            -X POST "${endpoint}" \
            -H "Content-Type: application/json" \
            -H "X-API-Key: ${RECOVERY_API_KEY}" \
            --data "${PAYLOAD}")"
          cat /tmp/recovery.json
          test "${code}" -ge 200 -a "${code}" -lt 300
