name: Build SamuraiOS and SAMURAI WhatsApp APKs

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Secret pattern scan
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE 'sk-(proj|svcacct)-[A-Za-z0-9_-]{20,}'; then
            echo "Potential OpenAI API key found in tracked files"
            exit 1
          fi
          echo "Secret scan: PASS"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Make Gradle executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build both Android applications
        working-directory: android
        run: ./gradlew clean assembleDebug :samurai-whatsapp:compileDebugKotlin :samurai-whatsapp:assembleDebug --stacktrace

      - name: Verify APKs
        working-directory: android
        run: |
          set -euo pipefail
          test -f app/build/outputs/apk/debug/app-debug.apk
          test -f samurai-whatsapp/build/outputs/apk/debug/samurai-whatsapp-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          ls -lh samurai-whatsapp/build/outputs/apk/debug/samurai-whatsapp-debug.apk
          DEX_CONTENT="$(unzip -p samurai-whatsapp/build/outputs/apk/debug/samurai-whatsapp-debug.apk classes.dex | strings)"
          grep -Fq 'Lcom/samurai/whatsapp/MainActivity;' <<< "$DEX_CONTENT"
          grep -Fq 'Lcom/samurai/whatsapp/WhatsAppNotificationListener;' <<< "$DEX_CONTENT"
          grep -Fq 'Lcom/samurai/whatsapp/NotificationArchive;' <<< "$DEX_CONTENT"
          echo "WhatsApp Kotlin classes present in APK: PASS"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SamuraiOS-and-SAMURAI-WhatsApp-debug-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/samurai-whatsapp/build/outputs/apk/debug/samurai-whatsapp-debug.apk
          if-no-files-found: error
