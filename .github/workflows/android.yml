name: Build SamuraiOS APK

on:
  push:
    branches: [ "main", "master", "feat/**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Secret pattern scan
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE 'sk-(proj|svcacct)-[A-Za-z0-9_-]{20,}'; then
            echo "Potential OpenAI API key found in tracked files"
            exit 1
          fi
          echo "Secret scan: PASS"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"

          SDKMANAGER=""
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          elif [ -d "$SDK_ROOT/cmdline-tools" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -111 -print -quit)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT"
            find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi

          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_SDKMANAGER" --licenses >/dev/null || true
          "$ANDROID_SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;34.0.0"

      - name: Make Gradle executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew clean assembleDebug --stacktrace

      - name: Verify APK
        working-directory: android
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SamuraiOS-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
