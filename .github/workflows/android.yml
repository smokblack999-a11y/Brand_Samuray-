name: Build SamuraiOS and SAMURAI WhatsApp APKs

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Secret pattern scan
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE 'sk-(proj|svcacct)-[A-Za-z0-9_-]{20,}'; then
            echo "Potential OpenAI API key found in tracked files"
            exit 1
          fi
          echo "Secret scan: PASS"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Make Gradle executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build both Android applications
        working-directory: android
        run: ./gradlew clean assembleDebug :samurai-whatsapp:compileDebugKotlin :samurai-whatsapp:assembleDebug --stacktrace

      - name: Verify APKs and packaged Kotlin classes
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build/outputs/apk/debug/app-debug.apk
          APK="samurai-whatsapp/build/outputs/apk/debug/samurai-whatsapp-debug.apk"
          test -f "$APK"
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          ls -lh "$APK"
          DEX_LIST="$(unzip -Z1 "$APK" | grep -E '^classes([0-9]+)?[.]dex$')"
          test -n "$DEX_LIST"
          DEX_CONTENT="$(while IFS= read -r dex; do unzip -p "$APK" "$dex"; done <<< "$DEX_LIST" | strings)"
          grep -Fq 'com/samurai/whatsapp/MainActivity' <<< "$DEX_CONTENT"
          grep -Fq 'com/samurai/whatsapp/WhatsAppNotificationListener' <<< "$DEX_CONTENT"
          grep -Fq 'com/samurai/whatsapp/NotificationArchive' <<< "$DEX_CONTENT"
          echo "WhatsApp Kotlin classes present in APK DEX: PASS"

      - name: Run SAMURAI WhatsApp archive tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim
          script: cd android && ./gradlew :samurai-whatsapp:connectedDebugAndroidTest --stacktrace

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SamuraiOS-and-SAMURAI-WhatsApp-debug-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/samurai-whatsapp/build/outputs/apk/debug/samurai-whatsapp-debug.apk
          if-no-files-found: error
